# markdownlint-cli2 (make lint). Relaxed for prose-heavy docs and skill files (project-template's config).
config:
  default: true
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD024:
    siblings_only: true
  MD033: false        # inline HTML (details/summary, kbd) is fine
  MD041: false        # skills and agents start with YAML front matter, not a heading
  MD060: false        # compact tables (| a | b |) are not padded to aligned columns
globs:
  - "**/*.md"
ignores:
  - api/**                                  # generated by swag
  - integrations/rigel-sync/vendor/**       # upstream all-set-tw, kept unedited
  - "**/node_modules/**"
# skip whatever git ignores (web/static/dist, data/, ...)
gitignore: true
