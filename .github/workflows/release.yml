# Publish a GitHub release for a vX.Y.Z tag. Mirrors .gitea/workflows/release.yaml
# -- both run the same .goreleaser.yaml, and GORELEASER_FORCE_TOKEN picks the
# forge. Tags arrive here through Gitea's push mirror.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs history and the previous tag

      - name: Install the pinned tools
        # Go and Bun from mise.toml; .goreleaser.yaml's before hook builds the frontend with bun
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14 # mise itself, as on the machines
          install_args: go bun # only what this job runs

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.3"
          args: release --clean
        env:
          GORELEASER_FORCE_TOKEN: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
