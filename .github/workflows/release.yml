# Publish a GitHub release for a vX.Y.Z tag. Mirrors .gitea/workflows/release.yaml
# -- both run the same .goreleaser.yaml, and GORELEASER_FORCE_TOKEN picks the
# forge. Tags arrive here through Gitea's push mirror.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0 # the changelog needs history and the previous tag

      - name: Set up Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: web/package.json

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GORELEASER_FORCE_TOKEN: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
