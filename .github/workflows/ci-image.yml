# Build rigel-ledger-ci, the image the `ci` job runs in (ci/Dockerfile: tools and
# PostgreSQL, no code), and push it to ghcr.io. Mirrors
# .gitea/workflows/ci-image.yaml (which pushes the same tags to
# git.chenantunez.com) -- change both together.
#
#   push to main touching what pins the tools -> :main, :sha-<12>
#   pull request touching the same            -> build only, nothing pushed
#   workflow_dispatch                         -> build; push only when run on main

name: CI image

on:
  push:
    branches: [main]
    paths:
      - mise.toml
      - .pre-commit-config.yaml
      - "ci/**"
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - mise.toml
      - .pre-commit-config.yaml
      - "ci/**"
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cwchen-twn/rigel-ledger-ci
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: "2026.11.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compute tags
        id: meta
        run: echo "sha_tag=sha-$(echo "$GITHUB_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to ghcr.io
        # main only: a dispatch on another branch builds but must not publish :main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          platforms: linux/amd64
          load: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:main,${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          build-args: MISE_VERSION=${{ env.MISE_VERSION }}
          # GitHub's job token works on api.github.com, so it lifts mise's rate limit here
          secrets: gh_token=${{ secrets.GITHUB_TOKEN }}
          labels: |
            org.opencontainers.image.source=https://github.com/cwchen-twn/rigel-ledger
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=RigelLedger's CI image (ci/Dockerfile): tools and PostgreSQL, no code

      - name: What the image holds
        run: docker run --rm -w /opt/ci "$IMAGE:main" sh -c 'mise --version; node --version; go version; psql --version; pre-commit --version'
