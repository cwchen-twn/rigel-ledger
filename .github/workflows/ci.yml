# CI: `make audit`, the gate, on every pull request and on main. Mirrors .gitea/workflows/ci.yaml --
# change both together; the two forges must reach the same verdict (see that file for the triggers and
# the image). Gitea is the primary remote and push-mirrors here, so this runs on the mirrored push to main.
# The one difference: the image comes from ghcr.io, and there is no cache volume for Go here.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md" # Gitea's matcher may want at least one directory for **/
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .mailmap
  pull_request:
    paths-ignore:
      - "*.md" # Gitea's matcher may want at least one directory for **/
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .mailmap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cwchen-twn/rigel-ledger-ci:main
    env:
      # The PostgreSQL started below, inside this job container.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Fail instead of skipping if the database is unreachable.
      REQUIRE_DB_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Pinned tools
        env:
          # Lifts api.github.com's anonymous 60/h limit for whatever mise has to fetch. This step only:
          # the later steps run the PR's own Makefile and scripts.
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout's safe.directory does not outlive its step; git runs later (gitleaks, pre-commit)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mise install

      - name: Start PostgreSQL 18
        run: |
          pg_ctlcluster 18 main start
          su postgres -c "psql -qc \"ALTER USER postgres PASSWORD 'postgres'\""

      - name: make audit
        run: make audit
