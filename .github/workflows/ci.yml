# CI for every push and pull request. Mirrors .gitea/workflows/ci.yaml --
# change both together; the two forges must reach the same verdict.
# Gitea is the primary remote and push-mirrors here, so this usually runs on
# the mirrored push rather than on a GitHub PR.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        # hcloud runs PostgreSQL 18; test against the same major.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # THE ONE INTENTIONAL DIFFERENCE between the Gitea and GitHub copies:
      # the job runs on the VM, so the service is reached through its mapped port.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Fail instead of skipping if the database is unreachable.
      REQUIRE_DB_TESTS: "1"
      # renovate: datasource=github-releases depName=sqlc-dev/sqlc extractVersion=^v(?<version>.+)$
      SQLC_VERSION: "1.31.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Build frontend
        run: cd web && bun install --frozen-lockfile && bun run build:prod

      - name: sqlc diff
        # internal/db is generated; fail if it no longer matches migrations/
        # and internal/db/queries/. The release binary avoids compiling sqlc's
        # cgo parser on every run.
        run: |
          set -eu
          curl -sSL --fail --retry 5 --retry-all-errors \
            "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp sqlc
          /tmp/sqlc diff

      - name: make audit
        run: make audit

  hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: pre-commit
        env:
          SKIP: no-commit-to-branch,make-audit
        run: |
          uv sync --dev
          .venv/bin/pre-commit run --all-files --show-diff-on-failure
