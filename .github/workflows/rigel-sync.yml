# The Node sync runner (integrations/rigel-sync): typecheck, node:test, and that vendor/ bundles are
# what their vendored all-set-tw source gives. Node runs our TypeScript directly (type stripping), so
# there is no build; Bun installs the dependencies and bundles vendor/. Node and Bun come from
# mise.toml. Runs only when the runner changes. Mirrors .gitea/workflows/rigel-sync.yaml -- change both together.

name: rigel-sync

on:
  push:
    branches: [main]
    paths:
      - "integrations/rigel-sync/**"
      - ".github/workflows/rigel-sync.yml"
      - mise.toml # Node and Bun
  pull_request:
    paths:
      - "integrations/rigel-sync/**"
      - ".github/workflows/rigel-sync.yml"
      - mise.toml # Node and Bun
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install the pinned tools
        uses: jdx/mise-action@v5.2.10
        with:
          version: 2026.11.11 # mise itself, as on the machines
          install_args: node bun # only what this job runs

      - name: Set up Chrome
        # The connector tests drive a pretend bank in a real browser.
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          install-dependencies: true

      - name: make rigel-sync/check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          RIGEL_SYNC_REQUIRE_CHROME: "1"
          # GitHub's Ubuntu 24.04 runner forbids the user namespaces Chrome's
          # sandbox needs for a Chrome outside /opt/google ("No usable sandbox");
          # Gitea's runs as root, where the shim already drops it. The pretend
          # bank is all it opens here.
          CHROME_ARGS: --no-sandbox
        run: make rigel-sync/check
