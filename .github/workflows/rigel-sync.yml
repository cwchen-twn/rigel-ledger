# The Node sync runner (integrations/rigel-sync): typecheck, node:test, and that vendor/ bundles are
# what their vendored all-set-tw source gives. Node runs our TypeScript directly (type stripping), so
# there is no build; Bun installs the dependencies and bundles vendor/. Node, Bun and Chromium come
# from rigel-ledger-ci (ci/Dockerfile), the image the ci job runs in. Runs only when the runner or the
# image changes. Mirrors .gitea/workflows/rigel-sync.yaml -- change both together.

name: rigel-sync

on:
  push:
    branches: [main]
    paths:
      - "integrations/rigel-sync/**"
      - ".github/workflows/rigel-sync.yml"
      - mise.toml # Node and Bun
      - "ci/**" # the image: Chromium, the CAPTCHA model
  pull_request:
    paths:
      - "integrations/rigel-sync/**"
      - ".github/workflows/rigel-sync.yml"
      - mise.toml # Node and Bun
      - "ci/**" # the image: Chromium, the CAPTCHA model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cwchen-twn/rigel-ledger-ci:main
    env:
      # The image sets CHROME_PATH (Debian's chromium) and RIGEL_SYNC_OCR_MODEL (the CAPTCHA
      # model, baked in); the job runs as root, which the launcher already runs without a sandbox.
      RIGEL_SYNC_REQUIRE_CHROME: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pinned tools
        env:
          # Lifts api.github.com's anonymous 60/h limit for whatever mise has to fetch. This step only:
          # the later steps run the PR's own Makefile and scripts.
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout's safe.directory does not outlive its step; git runs later (gitleaks, pre-commit)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mise install node bun

      - name: make rigel-sync/check
        run: make rigel-sync/check
