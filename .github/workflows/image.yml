# Build the container images -- the app (Dockerfile) and the sync runner
# (integrations/rigel-sync/Dockerfile, as rigel-ledger-sync) -- and push them
# to ghcr.io, with the same tags. Mirrors
# .gitea/workflows/image.yaml (which pushes the same tags to
# git.chenantunez.com) -- change both together.
#
#   push to main  -> :sha-<12>, :latest   VERSION=sha-<12>
#   tag vX.Y.Z    -> :vX.Y.Z, :sha-<12>   VERSION=X.Y.Z

name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cwchen-twn/rigel-ledger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compute tags
        id: meta
        run: |
          set -eu
          SHORT="$(echo "$GITHUB_SHA" | cut -c1-12)"
          SHA_TAG="sha-$SHORT"
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/v}"
              TAGS="$IMAGE:v$VERSION,$IMAGE:$SHA_TAG"
              SYNC_TAGS="$IMAGE-sync:v$VERSION,$IMAGE-sync:$SHA_TAG"
              ;;
            *)
              VERSION="$SHA_TAG"
              TAGS="$IMAGE:$SHA_TAG,$IMAGE:latest"
              SYNC_TAGS="$IMAGE-sync:$SHA_TAG,$IMAGE-sync:latest"
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "commit=$SHORT"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags=$TAGS"
            echo "sync_tags=$SYNC_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/cwchen-twn/rigel-ledger
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Build and push the sync runner
        # linux/amd64 only on both forges, the owner's call (2026-10-06):
        # arm64 on Gitea would mean registering QEMU in the k3s node's kernel;
        # Apple silicon runs it under Rosetta.
        uses: docker/build-push-action@v7.4.0
        with:
          context: integrations/rigel-sync
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.sync_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/cwchen-twn/rigel-ledger
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.description=RigelLedger's sync runner (integrations/rigel-sync)
