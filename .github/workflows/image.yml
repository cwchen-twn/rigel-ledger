# Build the container image and push it to ghcr.io. Mirrors
# .gitea/workflows/image.yaml (which pushes the same tags to
# git.chenantunez.com) -- change both together.
#
#   push to main  -> :sha-<12>, :latest   VERSION=sha-<12>
#   tag vX.Y.Z    -> :vX.Y.Z, :sha-<12>   VERSION=X.Y.Z

name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cwchen-twn/rigel-ledger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          set -eu
          SHORT="$(echo "$GITHUB_SHA" | cut -c1-12)"
          SHA_TAG="sha-$SHORT"
          case "$GITHUB_REF" in
            refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/v}"
              TAGS="$IMAGE:v$VERSION,$IMAGE:$SHA_TAG"
              ;;
            *)
              VERSION="$SHA_TAG"
              TAGS="$IMAGE:$SHA_TAG,$IMAGE:latest"
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "commit=$SHORT"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/cwchen-twn/rigel-ledger
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
