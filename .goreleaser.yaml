# GoReleaser configuration for rigel-ledger

version: 2

builds:
  - id: rigel-ledger
    binary: rigel-ledger
    main: ./cmd/rigel-ledger
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: rigel-ledger
    ids: [rigel-ledger]
    name_template: "rigel-ledger_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'

release:
  name_template: "Release {{.Version}}"
  header: |
    # Version {{.Version}}

    ## What's Changed
  footer: |
    ## Contributors
    {{range .Contributors}}- {{.Name}}
    {{end}}

  draft: false
  prerelease: false

snapshot:
  version_template: "{{.Tag}}-SNAPSHOT"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

