repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args:
          - --branch
          - main
      - id: check-merge-conflict
      # vendor/all-set-tw is upstream's, unedited: scripts/vendor.ts checks it.
      - id: trailing-whitespace
        exclude: ^integrations/tw-sync/vendor/all-set-tw/
      - id: end-of-file-fixer
        exclude: ^integrations/tw-sync/vendor/all-set-tw/
      - id: check-case-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: forbid-submodules

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-gitlab-ci
        args: ["--verbose"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: make-audit
        name: Make Audit
        entry: make audit
        language: system
        stages: [pre-commit]
        pass_filenames: true
        always_run: true
        verbose: true
        description: "Run code quality checks and security audits via make audit"
