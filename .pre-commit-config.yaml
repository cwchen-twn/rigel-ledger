# Hooks installed by `make init`: on commit, the fast file checks on staged files plus `make lint`;
# on push, `make audit` (the gate, with the database tests). `make lint/hygiene` runs the file checks
# on every file, so CI applies them too (it skips make-lint/make-audit, which would recurse, and the
# branch and staged-only hooks).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args:
          - --branch
          - main
      - id: check-merge-conflict
      # vendor/all-set-tw is upstream's, unedited: scripts/vendor.ts checks it.
      - id: trailing-whitespace
        exclude: ^integrations/rigel-sync/vendor/all-set-tw/
      - id: end-of-file-fixer
        exclude: ^integrations/rigel-sync/vendor/all-set-tw/
      - id: check-case-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: forbid-submodules

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: make-lint
        name: make lint
        entry: make lint
        language: system
        stages: [pre-commit]
        # One run for the whole commit: with file names, pre-commit splits a
        # large commit into batches and runs the target once per batch.
        pass_filenames: false
        require_serial: true
        always_run: true

      - id: make-audit
        name: make audit
        entry: make audit
        language: system
        stages: [pre-push]
        # The whole gate once per push, against one database (see make-lint).
        pass_filenames: false
        require_serial: true
        always_run: true
        verbose: true
