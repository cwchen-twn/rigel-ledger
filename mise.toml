# Tool and runtime versions for this repo: the same ones locally, in CI and in the images.
# Project pins, not global installs: Mason still owns the editor's language servers.
# Moved together with go.mod (go directive), the Dockerfiles and package.json packageManager:
# `make upgrade/go` / `make upgrade/bun` do it by hand, Renovate's groups do it on its schedule.
# `make upgradeable` lists newer versions.

[tools]
go = "1.27.4"
bun = "1.4.4"
node = "24.22.3"                         # runs rigel-sync's TypeScript directly (type stripping)

# The gate (`make lint` / `make audit`) and the dev targets: binaries, so nothing is `go run …@latest`
"aqua:sqlc-dev/sqlc" = "1.31.1"          # make sqlc; make lint runs `sqlc diff`
"aqua:dominikh/go-tools/staticcheck" = "2026.2.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
"aqua:golang-migrate/migrate" = "4.20.1" # make migrations/*, db/reset
"aqua:air-verse/air" = "1.67.4"          # make run/live
"aqua:swaggo/swag" = "1.16.6"            # make swag; keep on go.mod's github.com/swaggo/swag
gitleaks = "8.30.1"
python = "3.13"                          # runs pre-commit
pre-commit = "4.7.0"
uv = "0.13.9"                            # make git/analyze (uvx)
"npm:markdownlint-cli2" = "0.24.2"
