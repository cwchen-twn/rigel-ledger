# Build rigel-ledger-ci, the image the `ci` job runs in (ci/Dockerfile: tools and
# PostgreSQL, no code), and push it to Gitea's registry. Mirrors
# .github/workflows/ci-image.yml (which pushes the same tags to ghcr.io) --
# change both together.
#
#   push to main touching what pins the tools -> :main, :sha-<12>
#   pull request touching the same            -> build only, nothing pushed
#   workflow_dispatch                         -> build; push only when run on main
#
# The `ci` job still runs `mise install` first, so a PR that bumps a pin passes
# before this rebuilds the image; merging it rebuilds :main.
#
# Runner details are image.yaml's (in-cluster checkout URL, the docker CLI and
# buildx plugin from Docker's apt repo, REGISTRY_* as user-level secrets).

name: ci-image

on:
  push:
    branches: [main]
    paths:
      - mise.toml
      - .pre-commit-config.yaml
      - "ci/**"
      - .gitea/workflows/ci-image.yaml
  pull_request:
    paths:
      - mise.toml
      - .pre-commit-config.yaml
      - "ci/**"
      - .gitea/workflows/ci-image.yaml
  workflow_dispatch:

env:
  REGISTRY: git.chenantunez.com
  IMAGE_PATH: cwchen-twn/rigel-ledger-ci
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: "2026.11.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          github-server-url: http://gitea-http.gitea.svc.cluster.local:3000

      - name: Install the Docker CLI
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL --retry 5 --retry-all-errors https://download.docker.com/linux/debian/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin
          docker version

      - name: Build
        env:
          # a no-scope github.com PAT: lifts the 60/h anonymous limit for mise's installs
          GH_PUBLIC_TOKEN: ${{ secrets.GH_PUBLIC_TOKEN }}
        run: |
          set -eu
          IMG="$REGISTRY/$IMAGE_PATH"
          SHA_TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-12)"
          # linux/amd64 only: the hcloud node is x86_64.
          docker build \
            --platform linux/amd64 \
            -f ci/Dockerfile \
            --build-arg MISE_VERSION="$MISE_VERSION" \
            --secret id=gh_token,env=GH_PUBLIC_TOKEN \
            -t "$IMG:main" -t "$IMG:$SHA_TAG" .
          # what the image holds, in the log
          docker run --rm -w /opt/ci "$IMG:main" sh -c 'mise --version; node --version; go version; psql --version; pre-commit --version; chromium --version; ls -l /opt/rigel-sync/models'

      - name: Push
        # main only: a dispatch on another branch builds but must not publish :main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          IMG="$REGISTRY/$IMAGE_PATH"
          SHA_TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-12)"
          for t in main "$SHA_TAG"; do docker push "$IMG:$t"; done
          echo "pushed $IMG: main $SHA_TAG"
