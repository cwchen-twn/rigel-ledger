# CI: `make audit`, the gate, on every pull request and on main. It runs only here: the public GitHub
# mirror carries the code and publishes images and releases, but runs no CI (owner's call, 2026-11-25).
# CI runs nothing that isn't a make target.
#
# The job runs in rigel-ledger-ci (ci/Dockerfile, rebuilt by ci-image.yaml whenever mise.toml,
# .pre-commit-config.yaml or ci/ change on main): every mise.toml tool, pre-commit's hook environments,
# PostgreSQL 18 and Chromium are already there. `mise install` still runs first: a no-op when the image
# matches mise.toml, and just the difference when a PR bumps a pin before the image is rebuilt, so CI
# always runs the pinned versions. Go's build and module caches live on the pool runner's own ci-go-cache
# volume (/ci-cache): content-addressed, so sharing them between jobs and repos is safe.
#
# Triggers: push to main + pull_request, not every push: a PR branch push used to run CI twice (push and
# pull_request), one after the other on what was then a single runner. Docs-only changes skip it (paths-ignore);
# markdownlint still runs on them in the pre-commit hook. There is no branch protection, so a skipped run
# blocks nothing. integrations/rigel-sync has its own path-filtered workflow.
#
# Runner facts (labels: catopia/hcloud#212, hcloud k3s/helm/act-runner/CLAUDE.md):
#   * `linux` is the runner pool (histesting), off the VPS. Checkout uses the
#     public name: the in-cluster Service does not exist from there.
#   * Job containers sit on docker's default bridge, which has no service DNS:
#     hence PostgreSQL inside the job container rather than a `services:` one.
#   * ci-image.yaml builds :main on the VPS (registry-push); the pool pulls it
#     through Cloudflare (only request bodies are capped). Pin drift is covered
#     by `mise install` below either way.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md" # Gitea's matcher may want at least one directory for **/
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .mailmap
  pull_request:
    paths-ignore:
      - "*.md" # Gitea's matcher may want at least one directory for **/
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .mailmap
  workflow_dispatch:

jobs:
  audit:
    runs-on: linux
    container:
      image: git.chenantunez.com/cwchen-twn/rigel-ledger-ci:main
    env:
      # The PostgreSQL started below, inside this job container.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Fail instead of skipping if the database is unreachable.
      REQUIRE_DB_TESTS: "1"
      # Go's caches on the pool runner's volume; only this forge has it.
      GOCACHE: /ci-cache/go-build
      GOMODCACHE: /ci-cache/go-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Pinned tools
        env:
          # A no-scope github.com PAT (user/org-level secret): lifts api.github.com's anonymous 60/h
          # limit for whatever mise has to fetch; the Gitea job token is rejected there (401). This
          # step only: the later steps run the PR's own Makefile and scripts.
          MISE_GITHUB_TOKEN: ${{ secrets.GH_PUBLIC_TOKEN }}
        run: |
          # checkout's safe.directory does not outlive its step; git runs later (gitleaks, pre-commit)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mise install

      - name: Start PostgreSQL 18
        run: |
          pg_ctlcluster 18 main start
          su postgres -c "psql -qc \"ALTER USER postgres PASSWORD 'postgres'\""

      - name: make audit
        # frontend build, lint (file hooks, markdownlint, gofmt, vet, staticcheck, sqlc diff), tests with
        # -race, go mod tidy -diff / verify, govulncheck, gitleaks
        run: make audit
