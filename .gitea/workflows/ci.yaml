# CI for every push and pull request. Mirrors .github/workflows/ci.yml --
# change both together; the two forges must reach the same verdict.
#
# Runner facts inherited from hcloud (see hcloud/.gitea/CLAUDE.md):
#   * ubuntu-latest maps to node:22-bookworm on the act-runner. It has node,
#     which JavaScript actions need, and gcc, which `go test -race` needs.
#   * Checkout goes through the in-cluster Service. The public name is behind
#     Cloudflare, which has 403'd job-container fetches before.
#   * The runner has no cache server, so setup-go caching is off.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        # hcloud runs PostgreSQL 18; test against the same major.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # THE ONE INTENTIONAL DIFFERENCE between the Gitea and GitHub copies:
      # the job runs in a container on the same docker network as the service,
      # so it is reached by its service name.
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      # Fail instead of skipping if the database is unreachable.
      REQUIRE_DB_TESTS: "1"
      # renovate: datasource=github-releases depName=sqlc-dev/sqlc extractVersion=^v(?<version>.+)$
      SQLC_VERSION: "1.31.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://gitea-http.gitea.svc.cluster.local:3000

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Build frontend
        # Proves the SPA compiles; the Go embed then carries a real bundle.
        run: cd web && bun install --frozen-lockfile && bun run build:prod

      - name: sqlc diff
        # internal/db is generated; fail if it no longer matches migrations/
        # and internal/db/queries/. The release binary avoids compiling sqlc's
        # cgo parser on every run.
        run: |
          set -eu
          curl -sSL --fail --retry 5 --retry-all-errors \
            "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp sqlc
          /tmp/sqlc diff

      - name: make audit
        # tests with -race, go mod tidy -diff, gofmt, vet, staticcheck, govulncheck
        run: make audit

  hooks:
    # The pre-commit hooks, server-side, so a commit made with --no-verify or
    # without `make init` is still checked. make-audit is the job above, and
    # no-commit-to-branch would fail every push to main by design.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://gitea-http.gitea.svc.cluster.local:3000

      - name: Set up Go
        # gitleaks is a golang-language hook and is built from source.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: pre-commit
        env:
          SKIP: no-commit-to-branch,make-audit
        run: |
          uv sync --dev
          .venv/bin/pre-commit run --all-files --show-diff-on-failure
