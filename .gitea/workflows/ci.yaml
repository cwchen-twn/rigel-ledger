# CI for every push and pull request. Mirrors .github/workflows/ci.yml --
# change both together; the two forges must reach the same verdict.
#
# Runner facts inherited from hcloud (see hcloud/.gitea/CLAUDE.md):
#   * ubuntu-latest maps to node:22-bookworm on the act-runner. It has node,
#     which JavaScript actions need, and gcc, which `go test -race` needs.
#   * Checkout goes through the in-cluster Service. The public name is behind
#     Cloudflare, which has 403'd job-container fetches before.
#   * The runner has no cache server, so setup-go caching is off.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # PostgreSQL runs INSIDE this job container (step below), so it is on
      # localhost -- the same URL the GitHub copy uses for its service container.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Fail instead of skipping if the database is unreachable.
      REQUIRE_DB_TESTS: "1"
      # renovate: datasource=github-releases depName=sqlc-dev/sqlc extractVersion=^v(?<version>.+)$
      SQLC_VERSION: "1.31.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://gitea-http.gitea.svc.cluster.local:3000

      - name: Start PostgreSQL 18
        # THE ONE INTENTIONAL DIFFERENCE from .github/workflows/ci.yml, which
        # uses a `services:` container. hcloud's runner puts job containers on
        # docker's default bridge (containerNetwork: bridge, chosen for the MTU
        # -- see hcloud/k3s/helm/act-runner), and the default bridge has no DNS:
        # a service container started fine and was healthy, then every test
        # failed with "lookup postgres ... no such host" (run 322). So the
        # server runs in the job container instead, from the PGDG repo to get
        # the same major as hcloud. Measured: ~60s including apt.
        run: |
          set -eu
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL --retry 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-18 >/dev/null
          pg_ctlcluster 18 main start
          su postgres -c "psql -qc \"ALTER USER postgres PASSWORD 'postgres'\""

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Build frontend
        # Proves the SPA compiles; the Go embed then carries a real bundle.
        run: cd web && bun install --frozen-lockfile && bun run build:prod

      - name: sqlc diff
        # internal/db is generated; fail if it no longer matches migrations/
        # and internal/db/queries/. The release binary avoids compiling sqlc's
        # cgo parser on every run.
        run: |
          set -eu
          curl -sSL --fail --retry 5 --retry-all-errors \
            "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp sqlc
          /tmp/sqlc diff

      - name: make audit
        # tests with -race, go mod tidy -diff, gofmt, vet, staticcheck, govulncheck
        run: make audit

  hooks:
    # The pre-commit hooks, server-side, so a commit made with --no-verify or
    # without `make init` is still checked. make-audit is the job above, and
    # no-commit-to-branch would fail every push to main by design.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://gitea-http.gitea.svc.cluster.local:3000

      - name: Set up Go
        # gitleaks is a golang-language hook and is built from source.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: pre-commit
        env:
          SKIP: no-commit-to-branch,make-audit
        run: |
          uv sync --dev
          .venv/bin/pre-commit run --all-files --show-diff-on-failure
