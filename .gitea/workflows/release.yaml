# Publish a Gitea release for a vX.Y.Z tag. Mirrors .github/workflows/release.yml
# -- both run the same .goreleaser.yaml, and GORELEASER_FORCE_TOKEN picks the
# forge. Gitea push-mirrors the tag to GitHub, so one push produces both.
#
# RELEASE_TOKEN is a Gitea PAT with repository write. The env var GoReleaser
# reads is GITEA_TOKEN, but Gitea refuses secret names starting with GITEA_.
# The API goes to the in-cluster Service (gitea_urls in .goreleaser.yaml),
# because job containers do not get the runner's hostAliases.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          github-server-url: http://gitea-http.gitea.svc.cluster.local:3000
          fetch-depth: 0 # the changelog needs history and the previous tag

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GORELEASER_FORCE_TOKEN: gitea
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
