# Publish a Gitea release for a vX.Y.Z tag. Mirrors .github/workflows/release.yml
# -- both run the same .goreleaser.yaml, and GORELEASER_FORCE_TOKEN picks the
# forge. Gitea push-mirrors the tag to GitHub, so one push produces both.
#
# RELEASE_TOKEN is a Gitea PAT with repository write. The env var GoReleaser
# reads is GITEA_TOKEN, but Gitea refuses secret names starting with GITEA_.
# It runs on the `linux` pool, off the VPS (catopia/hcloud#212), so checkout and
# the API (gitea_urls in .goreleaser.yaml) use the public name: the in-cluster
# Service does not exist there. The uploads go through Cloudflare, whose 100MB
# request-body cap is far above the ~12MB archives; should one outgrow it, this
# job moves to registry-push with the in-cluster gitea_urls.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  goreleaser:
    runs-on: linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs history and the previous tag

      - name: Install the pinned tools
        # Go and Bun from mise.toml; .goreleaser.yaml's before hook builds the frontend with bun
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14 # mise itself, as on the machines
          install_args: go bun # only what this job runs
          cache: false
          # GH_PUBLIC_TOKEN: a no-scope github.com PAT (user/org-level secret) that lifts api.github.com's
          # anonymous 60/h limit; the default, the Gitea job token, is rejected there (401)
          github_token: ${{ secrets.GH_PUBLIC_TOKEN }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.3"
          args: release --clean
        env:
          GORELEASER_FORCE_TOKEN: gitea
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
