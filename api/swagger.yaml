      invite_ttl_seconds:
        type: integer
      login_ip_max_failures:
        type: integer
      login_max_failures:
        type: integer
      login_user_max_failures:
        type: integer
      login_window_seconds:
        type: integer
      mail_configured:
        type: boolean
      mail_driver:
        type: string
      mail_from:
        type: string
      mail_from_name:
        type: string
      mfa_methods:
