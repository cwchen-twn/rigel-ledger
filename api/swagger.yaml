info:
  contact: {}
  description: Session cookie (browser) or Bearer token (scripts, mobile). Cookie-authenticated
    POST/PUT/PATCH/DELETE must send X-Rigel-Client.
  title: RigelLedger API
  version: "1.0"
paths:
  /api/admin/access-requests:
    get:
      parameters:
      - description: pending, approved or rejected
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/routes.AccessRequestDTO'
            type: array
      summary: Requests for an account (admin)
      tags:
      - admin
  /api/admin/access-requests/{requestID}/approve:
    post:
      parameters:
      - description: request id
        in: path
        name: requestID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: 'Approve a request: the person is invited (admin)'
      tags:
      - admin
  /api/admin/access-requests/{requestID}/reject:
    post:
      parameters:
      - description: request id
        in: path
        name: requestID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Reject a request (admin)
      tags:
      - admin
  /api/admin/events:
    get:
      parameters:
      - description: at most 500
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/routes.AuthEventDTO'
            type: array
      summary: Recent sign-in and security events of everyone (admin)
      tags:
      - admin
  /api/admin/invitations:
    post:
      consumes:
      - application/json
      parameters:
      - description: who
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.inviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/routes.AdminUserDTO'
        "409":
          description: taken, or mail_failed (the invitation is saved; resend it)
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Invite a user by username and email (admin)
      tags:
      - admin
  /api/admin/invitations/{userID}:
    delete:
      parameters:
      - description: invited user id
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Withdraw an invitation that was not accepted; deletes that user (admin)
      tags:
      - admin
  /api/admin/invitations/{userID}/resend:
    post:
      parameters:
      - description: invited user id
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Mail a fresh invitation link; the old one stops working (admin)
      tags:
      - admin
  /api/admin/mail:
    patch:
      consumes:
      - application/json
      parameters:
      - description: mail
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.adminMailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.AdminSettingsDTO'
      summary: Outgoing mail settings (admin); the password is stored sealed and never
        returned
      tags:
      - admin
  /api/admin/mail/test:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.MailTestDTO'
        "409":
          description: mail_failed or mail_disabled
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Send a test email to yourself with the saved mail settings (admin)
      tags:
      - admin
  /api/admin/rates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.RateStatusDTO'
      summary: Recent exchange-rate fetches (admin)
      tags:
      - admin
  /api/admin/rates/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: optional day
        in: body
        name: body
        schema:
          $ref: '#/definitions/routes.refreshRatesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.RateFetchDTO'
        "502":
          description: every provider failed
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Fetch the latest exchange rates now, or one past day's (admin)
      tags:
      - admin
  /api/admin/runner:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.RunnerStatusDTO'
      summary: 'The sync runner: its tokens, keys and connectors'
      tags:
      - admin
  /api/admin/runner/tokens:
    post:
      consumes:
      - application/json
      parameters:
      - description: label and lifetime
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.CreateTokenDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/routes.TokenCreatedDTO'
      summary: Make a token for the sync runner (shown once)
      tags:
      - admin
  /api/admin/runner/tokens/{sessionID}:
    delete:
      parameters:
      - description: token id
        in: path
        name: sessionID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Revoke a sync runner token
      tags:
      - admin
  /api/admin/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.AdminSettingsDTO'
      summary: System settings (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      parameters:
      - description: every field
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.adminSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.AdminSettingsDTO'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Replace registration, security and default settings (admin)
      tags:
      - admin
  /api/admin/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/routes.AdminUserDTO'
            type: array
      summary: Every user (admin)
      tags:
      - admin
  /api/admin/users/{userID}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: user id
        in: path
        name: userID
        required: true
        type: integer
      - description: changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.adminUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.AdminUserDTO'
        "409":
          description: last_admin
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Activate, deactivate, promote or demote another user (admin)
      tags:
      - admin
  /api/admin/users/{userID}/reset-mfa:
    post:
      parameters:
      - description: user id
        in: path
        name: userID
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Remove every second factor and session of a user (admin)
      tags:
      - admin
  /api/auth/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.AuthConfigDTO'
      summary: What the signed-out pages may offer
      tags:
      - auth
  /api/auth/invite/{token}:
    get:
      parameters:
      - description: token from the link
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.InvitationDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: The invitation behind a link
      tags:
      - auth
    post:
      consumes:
      - application/json
      parameters:
      - description: token from the link
        in: path
        name: token
        required: true
        type: string
      - description: profile and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.acceptInviteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.signedInResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: 'Accept an invitation: settings and password, then signed in'
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.loginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "429":
          description: too many failures; see Retry-After
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: Sign in
      tags:
      - auth
  /api/auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Sign out this session
      tags:
      - auth
  /api/auth/mfa:
    post:
      consumes:
      - application/json
      parameters:
      - description: code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.mfaVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes.loginResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorBody'
      summary: 'Second sign-in step: a TOTP, emailed or recovery code'
      tags:
      - auth
  /api/auth/mfa/email:
    post:
      consumes:
      - application/json
      parameters:
      - description: the password step's challenge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.challengeRequest'
      responses:
        "204":
          description: No Content
      summary: Mail a code for the second sign-in step
      tags:
      - auth
  /api/auth/passkey/begin:
    post:
      consumes:
      - application/json
      parameters:
      - description: optional password-step challenge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routes.passkeyBeginRequest'
