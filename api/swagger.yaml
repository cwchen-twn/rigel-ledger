definitions:
  db.AccountClass:
    enum:
    - asset
    - liability
    - equity
    - income
    - expense
    type: string
    x-enum-varnames:
    - AccountClassAsset
    - AccountClassLiability
    - AccountClassEquity
    - AccountClassIncome
    - AccountClassExpense
  db.CfClass:
    enum:
    - operating
    - investing
    - financing
    type: string
    x-enum-varnames:
    - CfClassOperating
    - CfClassInvesting
    - CfClassFinancing
  db.CommodityKind:
    enum:
    - currency
    - security
    - points
    type: string
    x-enum-varnames:
    - CommodityKindCurrency
    - CommodityKindSecurity
    - CommodityKindPoints
  db.MemberRole:
    enum:
    - viewer
    - editor
    - owner
    type: string
    x-enum-varnames:
    - MemberRoleViewer
    - MemberRoleEditor
    - MemberRoleOwner
  db.PostingStatus:
    enum:
    - uncleared
    - cleared
    - reconciled
    type: string
    x-enum-varnames:
    - PostingStatusUncleared
    - PostingStatusCleared
    - PostingStatusReconciled
  response.ErrorBody:
    properties:
      error:
        $ref: '#/definitions/response.ErrorDetail'
    type: object
  response.ErrorDetail:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  routes.AcceptFailureDTO:
    properties:
      code:
        type: string
      row_id:
        type: integer
    type: object
  routes.AcceptResultDTO:
    properties:
      accepted:
        items:
          type: integer
        type: array
      failed:
        items:
          $ref: '#/definitions/routes.AcceptFailureDTO'
        type: array
      transactions:
        items:
          type: integer
        type: array
    type: object
  routes.AcceptRowsDTO:
    properties:
      account_id:
        description: Book them all against this category instead of the proposals.
        type: integer
      row_ids:
        items:
          type: integer
        type: array
    type: object
  routes.AccessRequestDTO:
    properties:
      created_at:
        type: string
      decided_at:
        type: string
      email:
        type: string
      id:
        type: integer
      ip:
        type: string
      message:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  routes.AccountBalanceDTO:
    properties:
      account_id:
        type: integer
      amounts:
        items:
          $ref: '#/definitions/routes.CommodityAmountDTO'
        type: array
      base_amount:
        type: string
      total_amounts:
        items:
          $ref: '#/definitions/routes.CommodityAmountDTO'
        type: array
      total_base_amount:
        type: string
    type: object
  routes.AccountDTO:
    properties:
      archived:
        type: boolean
      cf_class:
        $ref: '#/definitions/db.CfClass'
      class:
        $ref: '#/definitions/db.AccountClass'
      code:
        type: string
      commodity:
        type: string
      id:
        type: integer
      is_cash:
        type: boolean
      is_current:
        type: boolean
      is_placeholder:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
      template_key:
        type: string
    type: object
  routes.AdminSettingsDTO:
    properties:
      default_date_format:
        type: string
      default_display_currency:
        type: string
      default_language:
        type: string
      default_theme:
        type: string
      default_timezone:
        type: string
      invite_ttl_seconds:
        type: integer
      login_ip_max_failures:
        type: integer
      login_max_failures:
        type: integer
      login_user_max_failures:
        type: integer
      login_window_seconds:
        type: integer
      mail_configured:
        type: boolean
      mail_driver:
        type: string
      mail_from:
        type: string
      mail_from_name:
        type: string
      mfa_methods:
        items:
          type: string
        type: array
      mfa_required:
        type: boolean
      registration:
        type: string
      session_ttl_seconds:
        description: 'null: SESSION_TTL from the environment.'
        type: integer
      smtp_host:
        type: string
      smtp_password_set:
        type: boolean
      smtp_port:
        type: integer
      smtp_security:
        type: string
      smtp_user:
        type: string
      updated_at:
        type: string
    type: object
  routes.AdminUserDTO:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      initialized:
        type: boolean
      invite_pending:
        type: boolean
      invited:
        description: has not accepted yet
        type: boolean
      is_active:
        type: boolean
      is_admin:
        type: boolean
      last_login_at:
        type: string
      username:
        type: string
    type: object
  routes.AuthConfigDTO:
    properties:
      registration:
        description: 'closed: invitations only; request: /request-access; open: /register.'
        type: string
    type: object
  routes.AuthEventDTO:
    properties:
      created_at:
        type: string
      detail:
        additionalProperties: {}
        type: object
      event:
        type: string
      failure:
        type: boolean
      id:
        type: integer
      ip:
        type: string
      user_agent:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  routes.BalanceSheetDTO:
    properties:
      accumulated_result:
        type: string
      as_of:
        type: string
      base_currency:
        type: string
      currency:
        type: string
      current_assets:
        type: string
      current_liabilities:
        type: string
      equity_accounts:
        type: string
      lines:
        items:
          $ref: '#/definitions/routes.ReportLineDTO'
        type: array
      missing:
        items:
          type: string
        type: array
      non_current_assets:
        type: string
      non_current_liabilities:
        type: string
      rates_used:
        items:
          $ref: '#/definitions/routes.RateUsedDTO'
        type: array
      total_assets:
        type: string
      total_equity:
        type: string
      total_liabilities:
        type: string
      unrealised:
        type: string
    type: object
  routes.BalancesDTO:
    properties:
      accounts:
        items:
          $ref: '#/definitions/routes.AccountBalanceDTO'
        type: array
      as_of:
        format: date
        type: string
      base_currency:
        type: string
      check:
        type: string
      class_totals:
        additionalProperties:
          type: string
        type: object
    type: object
  routes.BookDTO:
    properties:
      base_currency:
        type: string
      id:
        type: integer
      interest_dividend_cf_class:
        $ref: '#/definitions/db.CfClass'
      lock_date:
        format: date
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/db.MemberRole'
    type: object
  routes.CashFlowDTO:
    properties:
      base_currency:
        type: string
      closing:
        type: string
      currency:
        type: string
      financing:
        type: string
      from:
        type: string
      fx_effect:
        type: string
      investing:
        type: string
      lines:
        items:
          $ref: '#/definitions/routes.CashFlowLineDTO'
        type: array
      missing:
        items:
          type: string
        type: array
      opening:
        type: string
      operating:
        type: string
      rates_used:
        items:
          $ref: '#/definitions/routes.RateUsedDTO'
        type: array
      to:
        type: string
    type: object
  routes.CashFlowLineDTO:
    properties:
      account_id:
        type: integer
      amount:
        type: string
      class:
        $ref: '#/definitions/db.CfClass'
    type: object
  routes.CatalogDTO:
    properties:
      connectors:
        items:
          $ref: '#/definitions/routes.ConnectorDTO'
        type: array
      key:
        allOf:
        - $ref: '#/definitions/routes.SealingKeyDTO'
        description: What to seal to; null while no runner has registered.
    type: object
  routes.ChallengeAnswerDTO:
    properties:
      answered:
        type: boolean
      expired:
        type: boolean
      sealed:
        description: |-
          Sealed to the runner with additional data "rigel-ledger/answer/v1\0<challenge id>";
          handed out once.
        type: string
    type: object
  routes.ChallengeCreatedDTO:
    properties:
      expires_at:
        type: string
      id:
        type: integer
    type: object
  routes.ChallengeDTO:
    properties:
      expires_at:
        type: string
      id:
        type: integer
      image:
        type: string
      kind:
        enum:
        - otp
        - captcha
        - device
        type: string
      prompt:
        type: string
    type: object
  routes.ChallengeInDTO:
    properties:
      image:
        description: A CAPTCHA image (PNG or JPEG, base64, under 256 KiB).
        type: string
      kind:
        enum:
        - otp
        - captcha
        - device
        type: string
      prompt:
        type: string
      ttl_seconds:
        type: integer
    type: object
  routes.ChallengeReplyDTO:
    properties:
      sealed:
        description: The answer, sealed with additional data "rigel-ledger/answer/v1\0<challenge
          id>".
        type: string
    type: object
  routes.ClaimDTO:
    properties:
      limit:
        type: integer
    type: object
  routes.CommodityAmountDTO:
    properties:
      amount:
        type: string
      commodity:
        type: string
    type: object
  routes.CommodityDTO:
    properties:
      code:
        type: string
      contract_size:
        type: string
      decimals:
        type: integer
      exchange_mic:
        type: string
      kind:
        $ref: '#/definitions/db.CommodityKind'
      name:
        type: string
      quote_currency:
        type: string
    type: object
  routes.ConnectionDTO:
    properties:
      book_id:
        type: integer
      book_name:
        type: string
      challenge:
        $ref: '#/definitions/routes.ChallengeDTO'
      connector:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      interval_hours:
        type: integer
      key_retired:
        description: 'The runner''s key changed since these credentials were sealed:
          enter them again.'
        type: boolean
      label:
        type: string
      last_error:
        type: string
      last_run_at:
        type: string
      run_requested:
        type: boolean
      status:
        enum:
        - new
        - ok
        - needs_user_action
        - failed
        type: string
    type: object
  routes.ConnectionInputDTO:
    properties:
      book_id:
        type: integer
      connector:
        type: string
      interval_hours:
        type: integer
      key_id:
        description: The runner key the credentials were sealed to (from GET /api/connectors).
        type: integer
      label:
        type: string
      sealed:
        description: |-
          The credentials as a JSON object of the connector's fields, sealed in
          the browser with additional data "rigel-ledger/credentials/v1\0<your user id>\0<connector>".
        type: string
    type: object
  routes.ConnectionUpdateDTO:
    properties:
      book_id:
        type: integer
      enabled:
        type: boolean
      interval_hours:
        type: integer
      label:
        type: string
    type: object
  routes.ConnectorDTO:
    properties:
      country:
        type: string
      fields:
        items:
          $ref: '#/definitions/routes.ConnectorFieldDTO'
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  routes.ConnectorFieldDTO:
    properties:
      kind:
        enum:
        - text
        - secret
        - id_number
        type: string
      label:
        type: string
      name:
        type: string
      optional:
        type: boolean
    type: object
  routes.CostBasisDTO:
    properties:
      cost:
        type: string
      quantity:
        type: string
      unit_cost:
        type: string
    type: object
  routes.CreateTokenDTO:
    properties:
      days:
        description: Days until it expires; default 365, at most 730.
        type: integer
      label:
        type: string
    type: object
  routes.CreatedDTO:
    properties:
      id:
        type: integer
    type: object
  routes.CredentialsDTO:
    properties:
      key_id:
        type: integer
      sealed:
        type: string
    type: object
  routes.CurrencyDTO:
    properties:
      code:
        type: string
      decimals:
        type: integer
      name:
        type: string
    type: object
  routes.CurrentRateDTO:
    properties:
      currency:
        type: string
      rate:
        description: 1 unit of currency in the book's base; null when no rate is known.
        type: string
    type: object
  routes.DriftDTO:
    properties:
      account_id:
        type: integer
      asserted:
        type: string
      booked:
        type: string
      date:
        type: string
      source:
        type: string
    type: object
  routes.EnrolledDTO:
    properties:
      recovery_codes:
        items:
          type: string
        type: array
    type: object
  routes.FinishDTO:
    properties:
      error:
        description: 'A stable code when failed: bad_credentials, challenge_expired,
          institution_down, ...'
        type: string
      status:
        enum:
        - ok
        - failed
        type: string
    type: object
  routes.IgnoreRowsDTO:
    properties:
      row_ids:
        items:
          type: integer
        type: array
    type: object
  routes.ImportAccountDTO:
    properties:
      currency:
        type: string
      id:
        description: The source's own id for the account (masked account number, card
          id).
        type: string
      label:
        type: string
    type: object
  routes.ImportBatchDTO:
    properties:
      accounts:
        items:
          $ref: '#/definitions/routes.ImportAccountDTO'
        type: array
      connector:
        type: string
      label:
        type: string
      rows:
        items:
          $ref: '#/definitions/routes.ImportRowInDTO'
        type: array
    type: object
  routes.ImportResultDTO:
    properties:
      balances:
        type: integer
      batch_id:
        type: integer
      duplicates:
        type: integer
      received:
        type: integer
      staged:
        type: integer
    type: object
  routes.ImportRowDTO:
    properties:
      account_id:
        description: The mapped account; null while the source account is unmapped.
        type: integer
      amount:
        type: string
      connector:
        type: string
      counterparty:
        type: string
      currency:
        type: string
      date:
        type: string
      description:
        type: string
      external_id:
        type: string
      id:
        type: integer
      kind:
        type: string
      match_row_id:
        type: integer
      match_transaction_id:
        type: integer
      pending:
        type: boolean
      proposal:
        enum:
        - new
        - duplicate
        - clears
        - transfer
        type: string
      proposed_account_id:
        type: integer
      rule_id:
        type: integer
      source_account_id:
        type: integer
      source_label:
        type: string
    type: object
  routes.ImportRowInDTO:
    properties:
      account:
        type: string
      amount:
        type: string
      counterparty:
        type: string
      currency:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        description: The source's id for the row, stable across resends.
        type: string
      kind:
        enum:
        - transaction
        - balance
        type: string
      pending:
        type: boolean
      raw:
        description: The source record as it came, for the audit; never credentials.
        type: object
    type: object
  routes.ImportRuleDTO:
    properties:
      account_id:
        type: integer
      id:
        type: integer
      pattern:
        type: string
      source_account_id:
        type: integer
    type: object
  routes.ImportRuleInputDTO:
    properties:
      account_id:
        type: integer
      pattern:
        description: Matched case-insensitively against the description and counterparty.
        type: string
      source_account_id:
        description: Only rows from this source account; null for all.
        type: integer
    type: object
  routes.IncomeStatementDTO:
    properties:
      base_currency:
        type: string
      currency:
        type: string
      expenses:
        type: string
      from:
        type: string
      income:
        type: string
      lines:
        items:
          $ref: '#/definitions/routes.ReportLineDTO'
        type: array
      missing:
        items:
          type: string
        type: array
      net_result:
        type: string
      rates_used:
        items:
          $ref: '#/definitions/routes.RateUsedDTO'
        type: array
      to:
        type: string
      unrealised:
        type: string
    type: object
  routes.InvitationDTO:
    properties:
      date_format:
        type: string
      display_currency:
        type: string
      display_name:
        type: string
      email:
        type: string
      language:
        type: string
      theme:
        type: string
      timezone:
        type: string
      username:
        type: string
    type: object
  routes.JobDTO:
    properties:
      book_id:
        type: integer
      connector:
        type: string
      id:
        type: integer
      key_id:
        type: integer
      sealed:
        description: |-
          Open with the key's private half and additional data
          "rigel-ledger/credentials/v1\0<user_id>\0<connector>" (internal/sealing).
        type: string
      user_id:
        type: integer
    type: object
  routes.LineInputDTO:
    properties:
      account_id:
        type: integer
      amount:
        type: string
      base_amount:
        type: string
      cleared_on:
        format: date
        type: string
      commodity:
        type: string
      memo:
        type: string
      status:
        $ref: '#/definitions/db.PostingStatus'
      unit_cost:
        type: string
    type: object
  routes.MFAStatusDTO:
    properties:
      allowed:
        description: What the administrator allows, and whether a second factor is
          required.
        items:
          type: string
        type: array
      email:
        type: boolean
      passkeys:
        items:
          $ref: '#/definitions/routes.PasskeyDTO'
        type: array
      recovery_left:
        type: integer
      required:
        type: boolean
      session_aal:
        type: integer
      signin_alerts:
        type: boolean
      totp:
        type: boolean
    type: object
  routes.MailTestDTO:
    properties:
      driver:
        type: string
      to:
        type: string
    type: object
  routes.MapSourceDTO:
    properties:
      account_id:
        description: null unmaps.
        type: integer
    type: object
  routes.MemberDTO:
    properties:
      display_name:
        type: string
      role:
        $ref: '#/definitions/db.MemberRole'
      user_id:
        type: integer
      username:
        type: string
    type: object
  routes.PasskeyDTO:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
    type: object
  routes.PasskeyOptionsDTO:
    properties:
      challenge:
        description: Send back to the matching finish endpoint.
        type: string
      options:
        description: PublicKeyCredentialCreationOptions / RequestOptions, as JSON
          for the browser.
    type: object
  routes.PostingDTO:
    properties:
      account_id:
        type: integer
      amount:
        type: string
      base_amount:
        type: string
      cleared_on:
        format: date
        type: string
      commodity:
        type: string
      id:
        type: integer
      memo:
        type: string
      status:
        $ref: '#/definitions/db.PostingStatus'
      unit_cost:
        type: string
    type: object
  routes.PriceDTO:
    properties:
      commodity:
        type: string
      date:
        format: date
        type: string
      id:
        type: integer
      quote:
        type: string
      rate:
        type: string
      source:
        type: string
    type: object
  routes.PublishConnectorsDTO:
    properties:
      connectors:
        items:
          $ref: '#/definitions/routes.ConnectorDTO'
        type: array
    type: object
  routes.RateDTO:
    properties:
      date:
        format: date
        type: string
      from:
        type: string
      rate:
        type: string
      to:
        type: string
    type: object
  routes.RateFetchDTO:
    properties:
      error:
        type: string
      fetched_at:
        type: string
      id:
        type: integer
      rate_date:
        type: string
      rates:
        type: integer
      requested:
        type: string
      skipped:
        type: integer
      source:
        type: string
    type: object
  routes.RateStatusDTO:
    properties:
      recent:
        items:
          $ref: '#/definitions/routes.RateFetchDTO'
        type: array
      scheduler:
        description: False when RATES_ENABLED=false or the scheduler is not wired
          (tests).
        type: boolean
    type: object
  routes.RateUsedDTO:
    properties:
      date:
        type: string
      from:
        type: string
      path:
        type: string
      rate:
        type: string
      to:
        type: string
    type: object
  routes.RebaseGapDTO:
    properties:
      date:
        type: string
      from:
        type: string
      to:
        type: string
    type: object
  routes.RebasePlanDTO:
    properties:
      adjusted:
        type: integer
      done:
        type: boolean
      from:
        type: string
      gaps:
        items:
          $ref: '#/definitions/routes.RebaseGapDTO'
        type: array
      postings:
        type: integer
      residue:
        type: string
      to:
        type: string
      transactions:
        type: integer
    type: object
  routes.ReportLineDTO:
    properties:
      account_id:
        type: integer
      amount:
        type: string
      historical:
        description: Balance sheet only.
        type: string
      holdings:
        items:
          $ref: '#/definitions/routes.CommodityAmountDTO'
        type: array
      revalued:
        type: boolean
      total:
        type: string
    type: object
  routes.RunnerKeyDTO:
    properties:
      created_at:
        type: string
      id:
        type: integer
      public_key:
        type: string
      retired_at:
        type: string
    type: object
  routes.RunnerKeysDTO:
    properties:
      public_keys:
        description: |-
          Every key the runner holds, oldest first, the one to seal to last
          (raw 32-byte X25519 public keys, base64).
        items:
          type: string
        type: array
    type: object
  routes.RunnerStatusDTO:
    properties:
      connectors:
        items:
          $ref: '#/definitions/routes.ConnectorDTO'
        type: array
      keys:
        items:
          $ref: '#/definitions/routes.RunnerKeyDTO'
        type: array
      tokens:
        items:
          $ref: '#/definitions/routes.RunnerTokenDTO'
        type: array
    type: object
  routes.RunnerTokenDTO:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      label:
        type: string
