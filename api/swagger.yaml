definitions:
  db.AccountClass:
    enum:
    - asset
    - liability
    - equity
    - income
    - expense
    type: string
    x-enum-varnames:
    - AccountClassAsset
    - AccountClassLiability
    - AccountClassEquity
    - AccountClassIncome
    - AccountClassExpense
  db.CfClass:
    enum:
    - operating
    - investing
    - financing
    type: string
    x-enum-varnames:
    - CfClassOperating
    - CfClassInvesting
    - CfClassFinancing
  db.CommodityKind:
    enum:
    - currency
    - security
    - points
    type: string
    x-enum-varnames:
    - CommodityKindCurrency
    - CommodityKindSecurity
    - CommodityKindPoints
  db.MemberRole:
    enum:
    - viewer
    - editor
    - owner
    type: string
    x-enum-varnames:
    - MemberRoleViewer
    - MemberRoleEditor
    - MemberRoleOwner
  db.PostingStatus:
    enum:
    - uncleared
    - cleared
    - reconciled
    type: string
    x-enum-varnames:
    - PostingStatusUncleared
    - PostingStatusCleared
    - PostingStatusReconciled
  response.ErrorBody:
    properties:
